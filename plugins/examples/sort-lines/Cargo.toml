[package]
name = "sort-lines"
version = "1.0.0"
edition = "2024"
publish = false

# Not part of the editor workspace: built separately for wasm32.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
